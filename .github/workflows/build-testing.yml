# Builds the mod's DLL on Windows for every source change pushed to the testing branch, and
# commits it as bbs-air-physics.dll at the top of the repo (what mod.yml installs).
name: Build testing DLL

on:
  push:
    branches: [testing]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-testing.yml"

permissions:
  contents: write

concurrency:
  group: build-testing
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - name: Rust (stable, MSVC)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test
        run: cargo test -p bbs-hook --locked
      - name: Build bbs-hook
        run: cargo build --release -p bbs-hook --locked
      - name: Commit bbs-air-physics.dll
        shell: bash
        run: |
          cp target/release/bbs_air_physics.dll bbs-air-physics.dll
          version=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";/\1/p' crates/bbs-hook/src/lib.rs)
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add bbs-air-physics.dll
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Build ${version} (bbs-air-physics.dll, from ${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git pull --rebase origin testing && git push origin HEAD:testing && exit 0
            sleep 5
          done
          exit 1
